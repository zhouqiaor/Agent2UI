<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Vue Test</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
<div id="app">
  <div>
    <h1>{{ message }}</h1>
    <button @click="count++">Clicked {{ count }} times</button>
  </div>
</div>
<script>
const { createApp, ref } = Vue;
createApp({
  setup() {
    return {
      message: ref('Hello Vue!'),
      count: ref(0)
    };
  }
}).mount('#app');
</script>
</body>
</html>
